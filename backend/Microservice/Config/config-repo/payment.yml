build:
  version: "1.0"

keycloak:
  auth-server-url: "http://localhost:7080"
  realm: "Nexusmart-ECommerce"
  client-id: "nexusmart-ecommerce"
  client-secret: "g5HFcWL6MHBFnrAe9FO0HhlMipOHzFNZ"
  master-id: "admin-cli"
  master-secret: ""
  admin-username: "admin"
  admin-password: "admin"

spring:
  kafka:
    bootstrap-servers: localhost:9092,localhost:9093,localhost:9094
    consumer:
      group-id: payment-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      retries: 3
      acks: all
    listener:
      ack-mode: manual
    topic:
      payment-result: paymentResultTopic
  datasource:
    url: jdbc:mysql://localhost:3313/paymentservice
    driverClassName: com.mysql.cj.jdbc.Driver
    username: root
    password: your_password
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/,http://localhost:8762/eureka/,http://localhost:8763/eureka/

payment:
  message: "This is Nexusmart-ECommerce's payment micro service"
  contactDetails:
    name: "Your Name - Developer"
    email: "your-email@example.com"
  onCallSupport:
    your-contact-info
