services:
  read:
    image: grafana/loki:2.9.5
    command: "-config.file=/etc/loki/config.yaml -target=read"
    ports:
      - 3101:3100
      - 7946
      - 9095
    volumes:
      - ../observability/loki/loki-config.yaml:/etc/loki/config.yaml
    depends_on:
      - minio
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: &loki-dns
      NexusMart:
        aliases:
          - loki

  write:
    image: grafana/loki:2.9.5
    command: "-config.file=/etc/loki/config.yaml -target=write"
    ports:
      - 3102:3100
      - 7946
      - 9095
    volumes:
      - ../observability/loki/loki-config.yaml:/etc/loki/config.yaml
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - minio
    networks:
      <<: *loki-dns

  promtail:
    image: grafana/promtail:2.9.5
    volumes:
      - ../observability/promtail/promtail-local-config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - gateway
    extends:
      file: common-config.yml
      service: network-deploy-service

  minio:
    image: minio/minio
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /data/loki-data && \
        mkdir -p /data/loki-ruler && \
        minio server /data
    environment:
      - MINIO_ROOT_USER=loki
      - MINIO_ROOT_PASSWORD=supersecret
      - MINIO_PROMETHEUS_AUTH_TYPE=public
      - MINIO_UPDATE=off
    ports:
      - 9000
    volumes:
      - ./.data/minio:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 15s
      timeout: 20s
      retries: 5
    extends:
      file: common-config.yml
      service: network-deploy-service

  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    extends:
      file: common-config.yml
      service: network-deploy-service

  tempo:
    image: grafana/tempo
    container_name: tempo
    command: -config.file /etc/tempo-config.yml
    ports:
      - "3110:3100"
      - "4317:4317"
    volumes:
      - ../observability/tempo/tempo.yml:/etc/tempo-config.yml
    extends:
      file: common-config.yml
      service: network-deploy-service

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
      - gateway
    entrypoint:
      - sh
      - -euc
      - |
        /run.sh
    ports:
      - "3010:3000"
    volumes:
      - ../observability/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3010/api/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    extends:
      file: common-config.yml
      service: network-deploy-service

  gateway:
    image: nginx:latest
    depends_on:
      - read
      - write
    entrypoint:
      - sh
      - -euc
      - |
        cat <<EOF > /etc/nginx/nginx.conf
        user  nginx;
        worker_processes  5;  ## Default: 1

        events {
          worker_connections   1000;
        }

        http {
          resolver 127.0.0.11;

          server {
            listen             3100;

            location = / {
              return 200 'OK';
              auth_basic off;
            }

            location = /api/prom/push {
              proxy_pass       http://write:3100\$$request_uri;
            }

            location = /api/prom/tail {
              proxy_pass       http://read:3100\$$request_uri;
              proxy_set_header Upgrade \$$http_upgrade;
              proxy_set_header Connection "upgrade";
            }

            location ~ /api/prom/.* {
              proxy_pass       http://read:3100\$$request_uri;
            }

            location = /loki/api/v1/push {
              proxy_pass       http://write:3100\$$request_uri;
            }

            location = /loki/api/v1/tail {
              proxy_pass       http://read:3100\$$request_uri;
              proxy_set_header Upgrade \$$http_upgrade;
              proxy_set_header Connection "upgrade";
            }

            location ~ /loki/api/.* {
              proxy_pass       http://read:3100\$$request_uri;
            }
          }
        }
        EOF
        /docker-entrypoint.sh nginx -g "daemon off;"
    ports:
      - "3100:3100"
    healthcheck:
      test: [ "CMD", "service", "nginx", "status" ]
      interval: 10s
      timeout: 5s
      retries: 5
    extends:
      file: common-config.yml
      service: network-deploy-service

  zoo1:
    image: confluentinc/cp-zookeeper:7.3.2
    hostname: zoo1
    container_name: zoo1
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    extends:
      file: common-config.yml
      service: network-deploy-service

  kafka1:
    image: confluentinc/cp-kafka:7.3.2
    hostname: kafka1
    container_name: kafka1
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zoo1:2181"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092,DOCKER://host.docker.internal:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    depends_on:
      - zoo1
    extends:
      file: common-config.yml
      service: network-deploy-service

  kafka2:
    image: confluentinc/cp-kafka:7.3.2
    hostname: kafka2
    container_name: kafka2
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: "zoo1:2181"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9093,DOCKER://host.docker.internal:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    depends_on:
      - zoo1
    extends:
      file: common-config.yml
      service: network-deploy-service

  kafka3:
    image: confluentinc/cp-kafka:7.3.2
    hostname: kafka3
    container_name: kafka3
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: "zoo1:2181"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9094,DOCKER://host.docker.internal:29094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    depends_on:
      - zoo1
    extends:
      file: common-config.yml
      service: network-deploy-service

  keycloak:
    image: quay.io/keycloak/keycloak:22.0.1
    container_name: keycloak
    ports:
      - "7080:8080"
    volumes:
      - ./init-scripts/keycloak_NexusMart.json:/opt/keycloak/data/import/realm-config.json
    environment:
      KEYCLOAK_ADMIN: "admin"
      KEYCLOAK_ADMIN_PASSWORD: "admin"
      KC_IMPORT: /opt/keycloak/data/import/realm-config.json
    command: ["start-dev", "--import-realm"]
    healthcheck:
      test: ["CMD-SHELL", "curl --head -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 20
      start_period: 10s
    extends:
      file: common-config.yml
      service: network-deploy-service

  redis-master:
    image: redis:7.0.9
    hostname: redis-master
    container_name: redis-master
    ports:
      - "6379:6379"
    command: redis-server --requirepass your_password --appendonly yes
    extends:
      file: common-config.yml
      service: network-deploy-service

  redis-sentinel1:
    image: redis:7.0.9
    hostname: redis-sentinel1
    container_name: redis-sentinel1
    ports:
      - "26379:26379"
    command: redis-sentinel /usr/local/etc/redis/sentinel.conf
    volumes:
      - ./redis/sentinel1.conf:/usr/local/etc/redis/sentinel.conf
    depends_on:
      - redis-master
    extends:
      file: common-config.yml
      service: network-deploy-service

  redis-sentinel2:
    image: redis:7.0.9
    hostname: redis-sentinel2
    container_name: redis-sentinel2
    ports:
      - "26380:26380"
    command: redis-sentinel /usr/local/etc/redis/sentinel.conf
    volumes:
      - ./redis/sentinel2.conf:/usr/local/etc/redis/sentinel.conf
    depends_on:
      - redis-master
    extends:
      file: common-config.yml
      service: network-deploy-service

  redis-sentinel3:
    image: redis:7.0.9
    hostname: redis-sentinel3
    container_name: redis-sentinel3
    ports:
      - "26381:26381"
    command: redis-sentinel /usr/local/etc/redis/sentinel.conf
    volumes:
      - ./redis/sentinel3.conf:/usr/local/etc/redis/sentinel.conf
    depends_on:
      - redis-master
    extends:
      file: common-config.yml
      service: network-deploy-service

  redis-slave1:
    image: redis:7.0.9
    hostname: redis-slave1
    container_name: redis-slave1
    ports:
      - "6380:6379"
    command: redis-server --slaveof redis-master 6379 --masterauth your_password --requirepass your_password
    depends_on:
      - redis-master
    extends:
      file: common-config.yml
      service: network-deploy-service

  redis-slave2:
    image: redis:7.0.9
    hostname: redis-slave2
    container_name: redis-slave2
    ports:
      - "6381:6379"
    command: redis-server --slaveof redis-master 6379 --masterauth your_password --requirepass your_password
    depends_on:
      - redis-master
    extends:
      file: common-config.yml
      service: network-deploy-service

  configserver:
    image: "NexusMart/configserver:v1"
    container_name: configserver
    ports:
      - "8090:8090"
    healthcheck:
      test: "curl --fail --silent http://localhost:8090/actuator/health/readiness | grep UP || exit 1"
      interval: 20s
      timeout: 5s
      retries: 20
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-base-config
    environment:
      OTEL_SERVICE_NAME: "configserver"
    depends_on:
      - kafka1
      - kafka2
      - kafka3
      - redis-master
      - redis-sentinel1
      - redis-sentinel2
      - redis-sentinel3

  eurekaserver1:
    image: "NexusMart/eurekaserver:v1"
    container_name: eurekaserver1
    ports:
      - "8761:8761"
    depends_on:
      configserver:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent http://localhost:8761/actuator/health/readiness | grep UP || exit 1"
      interval: 20s
      timeout: 5s
      retries: 20
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-configserver-config
    environment:
      SPRING_APPLICATION_NAME: "eurekaserver1"
      SPRING_PROFILES_ACTIVE: "eurekaserver1"
      OTEL_SERVICE_NAME: "eurekaserver1"
      EUREKA_INSTANCE_HOSTNAME: "eurekaserver1"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eurekaserver2:8762/eureka/,http://eurekaserver3:8763/eureka/"
      EUREKA_SERVER_ENABLESELF_PRESERVATION: "true"
      EUREKA_SERVER_RENEWALINTERVALINSECONDS: "30"
      EUREKA_SERVER_EVICTIONINTERVALTIMEMILLIS: "5000"
      EUREKA_SERVER_LEASEEXPIRATIONDURATIONINSECONDS: "90"
      EUREKA_SERVER_REPLICATETHROUGHPUTPERMINUTE: "600"
      EUREKA_SERVER_CIRCUITBREAKER_ENABLED: "true"

  eurekaserver2:
    image: "NexusMart/eurekaserver:v1"
    container_name: eurekaserver2
    ports:
      - "8762:8762"
    depends_on:
      configserver:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent http://localhost:8762/actuator/health/readiness | grep UP || exit 1"
      interval: 20s
      timeout: 5s
      retries: 20
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-configserver-config
    environment:
      SPRING_APPLICATION_NAME: "eurekaserver2"
      SPRING_PROFILES_ACTIVE: "eurekaserver2"
      OTEL_SERVICE_NAME: "eurekaserver2"
      EUREKA_INSTANCE_HOSTNAME: "eurekaserver2"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eurekaserver1:8761/eureka/,http://eurekaserver3:8763/eureka/"
      EUREKA_SERVER_ENABLESELF_PRESERVATION: "true"
      EUREKA_SERVER_RENEWALINTERVALINSECONDS: "30"
      EUREKA_SERVER_EVICTIONINTERVALTIMEMILLIS: "5000"
      EUREKA_SERVER_LEASEEXPIRATIONDURATIONINSECONDS: "90"
      EUREKA_SERVER_REPLICATETHROUGHPUTPERMINUTE: "600"
      EUREKA_SERVER_CIRCUITBREAKER_ENABLED: "true"

  eurekaserver3:
    image: "NexusMart/eurekaserver:v1"
    container_name: eurekaserver3
    ports:
      - "8763:8763"
    depends_on:
      configserver:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent http://localhost:8763/actuator/health/readiness | grep UP || exit 1"
      interval: 20s
      timeout: 5s
      retries: 20
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-configserver-config
    environment:
      SPRING_APPLICATION_NAME: "eurekaserver3"
      SPRING_PROFILES_ACTIVE: "eurekaserver3"
      OTEL_SERVICE_NAME: "eurekaserver3"
      EUREKA_INSTANCE_HOSTNAME: "eurekaserver3"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eurekaserver1:8761/eureka/,http://eurekaserver2:8762/eureka/"
      EUREKA_SERVER_ENABLESELF_PRESERVATION: "true"
      EUREKA_SERVER_RENEWALINTERVALINSECONDS: "30"
      EUREKA_SERVER_EVICTIONINTERVALTIMEMILLIS: "5000"
      EUREKA_SERVER_LEASEEXPIRATIONDURATIONINSECONDS: "90"
      EUREKA_SERVER_REPLICATETHROUGHPUTPERMINUTE: "600"
      EUREKA_SERVER_CIRCUITBREAKER_ENABLED: "true"

  userservice-master:
    image: mysql:8.4.0
    container_name: userservice-master
    extends:
      file: common-config.yml
      service: microservice-configserver-config
    environment:
      MYSQL_ROOT_PASSWORD: your_password
      MYSQL_DATABASE: userservice
      MYSQL_ALLOW_EMPTY_PASSWORD: true
    ports:
      - "3307:3306"
    volumes:
      - userservice_master_data:/var/lib/mysql
      - ./conf.d/master/userservice:/etc/mysql/conf.d
      - ./init-scripts/userservice-master:/docker-entrypoint-initdb.d
    command: ["/bin/sh", "-c", "chmod 644 /etc/mysql/conf.d/my.cnf && exec docker-entrypoint.sh --bind-address=0.0.0.0 --mysql-native-password=ON "]
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 30s
      retries: 10

  userservice-slave:
    image: mysql:8.4.0
    container_name: userservice-slave
    extends:
      file: common-config.yml
      service: microservice-configserver-config
    environment:
      MYSQL_ROOT_PASSWORD: your_password
      MYSQL_DATABASE: userservice
      MYSQL_ALLOW_EMPTY_PASSWORD: true
    ports:
      - "3308:3306"
    volumes:
      - userservice_slave_data:/var/lib/mysql
      - ./conf.d/slave:/etc/mysql/conf.d
      - ./init-scripts/userservice-slave:/docker-entrypoint-initdb.d
    command: ["/bin/sh", "-c", "chmod 644 /etc/mysql/conf.d/my.cnf && exec docker-entrypoint.sh --bind-address=0.0.0.0 --mysql-native-password=ON"]
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 30s
      retries: 10
    depends_on:
      userservice-master:
        condition: service_healthy

  orderservice-master:
